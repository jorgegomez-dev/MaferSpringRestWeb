    <script>
        let isLoggingOut = false;

// Función para obtener los parámetros desde localStorage
function getParams() {
    const id = localStorage.getItem('id');
    const session = localStorage.getItem('session');
    
    if (!id || !session) {
        console.error("ID o Session no están disponibles en localStorage.");
        // Si no existen los parámetros, redirigir al login
        window.location.href = 'login.html';
    }
}

// Función para redirigir a una página sin pasar los parámetros por URL (solo datos de id y sesion)
function redirectTo(page) {
    const id = localStorage.getItem('id');
    const session = localStorage.getItem('session');
    
    if (id && session) {
        // Redirigir a la página sin incluir parámetros en la URL
        window.location.href = page;
    } else {
        console.error("ID o Session no están disponibles en localStorage.");
        // Si no existen los parámetros, redirigir al login
        window.location.href = 'login.html';
    }
}

    // Función para enviar una solicitud con headers y redirigir a paginas con idUsuario adicional 
    // Solo para redirecciones desde Admin que requieran id, session y un valor id de otro usuario
    function sendRequestWithHeaders(page, userId) {
        const id = localStorage.getItem('id');
        const session = localStorage.getItem('session');
        
        if (id && session) {
            fetch(page, {
                method: 'GET',
                headers: {
                    'id': id,
                    'session': session,
                    'userId': userId
                }
            }).then(() => {
                // Guardar los valores de id y userId en localStorage
                localStorage.setItem('id', id);
                localStorage.setItem('session', session);
                                localStorage.setItem('targetUserId', userId);
                
                // Redirigir a la página solicitada
                window.location.href = page;
            }).catch(error => {
                console.error('Error en la redirección:', error);
            });
        } else {
            console.error("ID o Session no están disponibles en localStorage.");
            window.location.href = 'login.html';
        }
    }

// Función para hacer logout
function logout() {
    isLoggingOut = true; // Indicamos que se está haciendo logout
    const id = localStorage.getItem('id');
    const session = localStorage.getItem('session');

    if (id && session) {
        fetch(`http://localhost:8080/api/autenticacion/logout/${id}/${session}`, {
            method: 'GET'
        })
        .then(response => {
            if (response.ok) {
                localStorage.removeItem('id');
                localStorage.removeItem('session');
                window.location.href = 'login.html';
            } else {
                console.error('Error al cerrar sesión:', response.status);
               // alert('Error al cerrar sesión. Por favor, intenta de nuevo.');
            }
        })
        .catch(error => {
            console.error('Error de red:', error);
            //alert('No se pudo conectar al servidor. Por favor, intenta de nuevo.');
        });
    } else {
        window.location.href = 'login.html';
    }
}

// Función para desactivar el beforeunload temporalmente al navegar
function disableBeforeUnload() {
    window.removeEventListener('beforeunload', handleBeforeUnload);
}

// Función para manejar el evento beforeunload
function handleBeforeUnload(event) {
    if (!isLoggingOut) {
        logout();
    }
    event.preventDefault();
    event.returnValue = '';
}

// Evento beforeunload para logout al cerrar la pestaña o navegador
window.addEventListener('beforeunload', handleBeforeUnload);

window.onload = function() {
    getParams();
}


// Mostrar los campos de filtro según el filtro seleccionado
function mostrarFiltros() {
    const filterType = document.getElementById("filterType").value;

    // Ocultar todos los campos de entrada de filtro
    document.getElementById("filtroId").classList.add("hidden");
    document.getElementById("filtroNombre").classList.add("hidden");
    document.getElementById("filtroApellido").classList.add("hidden");
    document.getElementById("filtroSexo").classList.add("hidden");
    document.getElementById("filtroRol").classList.add("hidden");
    document.getElementById("filtroEmail").classList.add("hidden");
    document.getElementById("filtroFecha").classList.add("hidden");

    // Mostrar el campo de filtro correspondiente según la selección
    if (filterType === "idFiltro") {
        document.getElementById("filtroId").classList.remove("hidden");
    } else if (filterType === "nombre") {
        document.getElementById("filtroNombre").classList.remove("hidden");
    } else if (filterType === "apellido") {
        document.getElementById("filtroApellido").classList.remove("hidden");
    } else if (filterType === "sexo") {
        document.getElementById("filtroSexo").classList.remove("hidden");
    } else if (filterType === "rol") {
        document.getElementById("filtroRol").classList.remove("hidden");
    } else if (filterType === "email") {
        document.getElementById("filtroEmail").classList.remove("hidden");
    } else if (filterType === "asesoriaVencida") {
        document.getElementById("filtroFecha").classList.remove("hidden");
    }
}

// Aplicar el filtro seleccionado
function aplicarFiltro() {
    const filterType = document.getElementById("filterType").value;
    if (filterType === "idFiltro") {
        filtrarPorId();
    } else if (filterType === "nombre") {
        filtrarPorNombre();
    } else if (filterType === "apellido") {
        filtrarPorApellido();
    } else if (filterType === "sexo") {
        filtrarPorSexo();
    } else if (filterType === "rol") {
        filtrarPorRol();
    } else if (filterType === "email") {
        filtrarPorEmail();
    } else if (filterType === "asesoriaVencida") {
        filtrarPorAsesoriaVencida();
    } else if (filterType === "todos") {
        cargarTodos();
    }
}

// Cargar todos los usuarios sin enviar id y session en la URL
function cargarTodos() {
    const id = localStorage.getItem('id');
    const session = localStorage.getItem('session');
    
    if (id && session) {
        fetch("http://localhost:8080/api/usuarios/listarUsuarios", {
            method: 'GET',
            headers: {
                'id': id,        // Enviar id en los headers
                'session': session // Enviar session en los headers
            }
        })
        .then(response => {
            if (response.status === 401) {
                // Si el servidor responde con UNAUTHORIZED
                alert('Error de autenticación. La sesión ha expirado. Vuelva a loguearse.');
                window.location.href = 'login.html'; // Redirigir a la página de login
            } else if (response.ok) {
                return response.json(); // Si la respuesta es OK, devolver los datos
            } else {
                throw new Error('Error inesperado al cargar usuarios.');
            }
        })
        .then(data => cargarTabla(data)) // Procesar los datos si se cargaron correctamente
        .catch(error => console.error('Error al cargar usuarios:', error));
    } else {
        window.location.href = 'login.html'; // Redirigir si no hay id y session en localStorage
    }
}

// Filtrar por ID
function filtrarPorId() {
    const id = localStorage.getItem('id');
    const session = localStorage.getItem('session');
    const userId = document.getElementById("filtroId").value;
    
    if (id && session && userId) {
        fetch("http://localhost:8080/api/usuarios/buscarUsuarioId", {
            method: 'GET',
            headers: {
                'id': id,
                'session': session,
                'userId': userId
            }
        })
        .then(response => response.json())
        .then(data => cargarTabla([data]))
        .catch(error => console.error('Error al buscar por ID:', error));
    }
}

        // Función para cargar la tabla con los datos obtenidos

        // Función para redirigir y enviar el id y session por header
    function verUsuario(id) {

        sendRequestWithHeaders('/usuarioeditar.html', id);
    }

    function agregarRutina(id) {
        sendRequestWithHeaders('/usuariorutinaagregar.html', id);
    }

    function agregarAsesoria(id) {
        sendRequestWithHeaders('/usuarioasesoriaagregar.html', id);
    }


        // Cargar la tabla al iniciar
        document.addEventListener("DOMContentLoaded", cargarTodos);

// Función para eliminar un usuario pasando los parámetros por headers
function eliminarUsuario(userId) {
    if (confirm("¿Estás seguro de eliminar este usuario?")) {
        const id = localStorage.getItem('id');
        const session = localStorage.getItem('session');

        if (id && session) {
            fetch('http://localhost:8080/api/usuarios/deleteUsuario', {
                method: 'DELETE',
                headers: {
                    'id': id,
                    'session': session,
                    'userId': userId
                }
            })
            .then(response => {
            if (response.status === 401) {
                // Si el servidor responde con UNAUTHORIZED
              //  alert('Error de autenticación. La sesión ha expirado. Vuelva a loguearse.');
                window.location.href = 'login.html'; // Redirigir a la página de login
            } else if (response.ok) {
                return response.json(); // Si la respuesta es OK, devolver los datos
            } else {
                throw new Error('Error inesperado al eliminar usuario.');
            }
            })
            .catch(error => {
                console.error("Error al eliminar el usuario:", error);
                //alert("Error de red. Por favor, intenta de nuevo.");
            });
        } else {
            console.error("ID o Session no están disponibles en localStorage.");
            window.location.href = 'login.html';
        }
    }
}
