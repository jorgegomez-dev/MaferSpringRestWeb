    <!-- Tabla de pedidos -->
    <table>
        <thead>
            <tr>
                <th>ID Pedido</th>
                <th>ID Usuario</th>
                <th>Productos</th>
                <th>Precio Total</th>
                <th>Estado</th>
                <th>Fecha de Creación</th>

            </tr>

    <script>

        // Desde aca es el mismo codigo para todas las paginas de la app, con las funciones necesarias para
        // solicitar las validaciones correspondientes, el almacenamiento, la carga de id y session, y la informacion
        // servida para la siguiente pagina en localStorage()
        //-----------------------------------------------------------------------------------------------------------

    async function validarSession() {
        // Obtén el id y la sesión de localStorage
        const id = localStorage.getItem('id');
        const session = localStorage.getItem('session');

        if (!id || !session) {
            console.warn('ID o sesión no disponibles');
            window.location.href = '/login.html'; // Redirige al login si no están presentes
            return false; // La sesión no es válida
        }

        try {
            const response = await fetch('http://localhost:8080/api/autenticacion/validarSession', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'id': id,
                    'session': session
                }
            });

            if (response.ok) {
                return true; // La sesión es válida
            } else if (response.status === 401) {
                console.warn('Sesión inválida o expirada');
                // Borra el id y la sesión de localStorage
                localStorage.removeItem('id');
                localStorage.removeItem('session');
                // Redirige al usuario a la página de login
                window.location.href = '/login.html'; // Cambia esto a tu ruta de login
                return false;
            } else {
                console.error('Error al validar la sesión:', response.statusText);
                return false; // Otros errores
            }
        } catch (error) {
            console.error('Error al validar la sesión:', error);
            return false; // Error al validar
        }
    }

    // Ejecuta la validación de sesión al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
        validarSession(); // Verifica la sesión al cargar cualquier página
    });

        // Hasta aca es el mismo codigo para todas las paginas de la app, con las funciones necesarias para
        // solicitar las validaciones correspondientes, el almacenamiento, la carga de id y session, y la informacion
        // servida para la siguiente pagina.
        //-----------------------------------------------------------------------------------------------------------

        // Cargar pedidos desde el servidor con fetch cuando se carga la página
        document.addEventListener("DOMContentLoaded", function() {
            cargarTodosLosPedidos(); // Llama a la función para cargar todos los pedidos inicialmente
        });

        // Función para mostrar u ocultar los campos adicionales según el filtro seleccionado
        function toggleFilterOptions() {
            const filterValue = document.getElementById("filterSelect").value;
            document.getElementById("userFilter").style.display = (filterValue === "usuario") ? "block" : "none";
            document.getElementById("dateFilter").style.display = (filterValue === "fecha") ? "block" : "none";
        }

        // Función para cargar todos los pedidos
        function cargarTodosLosPedidos() {
            fetch("http://localhost:8080/api/pedidos/listarPedidos")
                .then(response => response.json())
                .then(data => {
                    cargarTabla(data); // Llama a la función para cargar los datos en la tabla
                })
                .catch(error => console.error('Error al listar todos los pedidos:', error));
        }

        // Función para filtrar pedidos según la opción seleccionada
        function filtrarPedidos() {
            const filterValue = document.getElementById("filterSelect").value;
            const pedidoTableBody = document.getElementById("pedidoTableBody");
            pedidoTableBody.innerHTML = ""; // Limpiar la tabla antes de cargar los datos filtrados

            if (filterValue === "activos") {
                fetch("http://localhost:8080/api/pedidos/listarPedidosActivos")
                .then(response => response.json())
                .then(data => {
                    cargarTabla(data); // Llama a la función para cargar los datos en la tabla
                })
                .catch(error => console.error('Error al listar todos los pedidos:', error));

            } else if (filterValue === "usuario") {
                const idUsuario = document.getElementById("userIdInput").value;
                fetch(`http://localhost:8080/api/pedidos/listarPedidosPorUsuario/${idUsuario}`)
                .then(response => response.json())
                .then(data => cargarTabla(data))
                .catch(error => console.error('Error al filtrar pedidos por usuario:', error));

            } else if (filterValue === "fecha") {
                const fecha = document.getElementById("dateInput").value;
                fetch("http://localhost:8080/api/pedidos/listarPedidosPorFecha", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ fecha })
                })
                .then(response => response.json())
                .then(data => cargarTabla(data))
                .catch(error => console.error('Error al filtrar pedidos por fecha:', error));

            } else {
                // Si no hay filtros, cargar todos los pedidos
                cargarTodosLosPedidos();
            }
        }

        // Función para cargar los datos en la tabla
        function cargarTabla(data) {
            const pedidoTableBody = document.getElementById("pedidoTableBody");
            pedidoTableBody.innerHTML = "";

            data.forEach(pedido => {
                const row = document.createElement("tr");

                const productos = [
                    `Producto 1 (ID: ${pedido.idProductoUno}, Cant: ${pedido.cantProductoUno})`,
                    `Producto 2 (ID: ${pedido.idProductoDos}, Cant: ${pedido.cantProductoDos})`,
                    `Producto 3 (ID: ${pedido.idProductoTres}, Cant: ${pedido.cantProductoTres})`,
                    `Producto 4 (ID: ${pedido.idProductoCuatro}, Cant: ${pedido.cantProductoCuatro})`,
                    `Producto 5 (ID: ${pedido.idProductoCinco}, Cant: ${pedido.cantProductoCinco})`,
                    `Producto 6 (ID: ${pedido.idProductoSeis}, Cant: ${pedido.cantProductoSeis})`,
                    `Producto 7 (ID: ${pedido.idProductoSiete}, Cant: ${pedido.cantProductoSiete})`,
                    `Producto 8 (ID: ${pedido.idProductoOcho}, Cant: ${pedido.cantProductoOcho})`,
                    `Producto 9 (ID: ${pedido.idProductoNueve}, Cant: ${pedido.cantProductoNueve})`,
                    `Producto 10 (ID: ${pedido.idProductoDiez}, Cant: ${pedido.cantProductoDiez})`
                ].filter(p => !p.includes('undefined')).join(', ');

                row.innerHTML = 
                    `<td>${pedido.id}</td>
                    <td>${pedido.idUsuario}</td>
                    <td>${productos}</td>
                    <td>${pedido.precioTotal}</td>
                    <td>${pedido.estado}</td>
                    <td>${pedido.createdOn}</td>
                    <td>
                        <button class="view-button" onclick="verPedido(${pedido.id})">Ver</button>
                        <button class="delete-button" onclick="eliminarPedido(${pedido.id})">Eliminar</button>
                    </td>`;

                pedidoTableBody.appendChild(row);
            });
        }

        // Función para eliminar un pedido
        function eliminarPedido(id) {
            if (confirm("¿Estás seguro de eliminar este pedido?")) {
                fetch(`http://localhost:8080/api/pedidos/deletePedido/${id}`, {
                    method: 'DELETE'
                }).then(response => {
                    if (response.ok) {
                        console.log("Pedido eliminado correctamente.");
                        filtrarPedidos(); // Recargar los pedidos tras eliminar
                    } else {
                        console.log("Error al eliminar el pedido.");
                    }
                }).catch(error => {
                    console.error('Error al eliminar pedido:', error);
                });
            }
        }

        // Función para ver un pedido (ejemplo de funcionalidad)
        function verPedido(id) {
            window.location.href = `pedidover.html?id=${id}`;
        }
