<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Pedido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .ticket {
            border: 1px solid #ddd;
            padding: 20px;
            max-width: 600px;
        }
        .ticket h2 {
            text-align: center;
        }
        .ticket table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .ticket table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        .total {
            text-align: right;
            margin-top: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            text-decoration: none;
            margin-top: 20px;
        }
        .usuario-info {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="ticket">
        <h2>Pedido #<span id="pedidoId"></span></h2>
        <p>Fecha de creación: <span id="createdOn"></span></p>
        <p>Estado: <span id="estado"></span></p>

        <div class="usuario-info">
            <h3>Información del Usuario</h3>
            <p>ID Usuario: <span id="usuarioId"></span></p>
            <p>Nombre: <span id="nombreUsuario"></span></p>
            <p>Apellido: <span id="apellidoUsuario"></span></p>
            <p>Email: <span id="emailUsuario"></span></p>
            <p>Teléfono: <span id="telefonoUsuario"></span></p>
            <p>Username: <span id="usernameUsuario"></span></p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID Producto</th>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Marca</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody id="productosLista">
                <!-- Productos se agregarán aquí -->
            </tbody>
        </table>

        <div class="total">
            <strong>Total: $<span id="precioTotal"></span></strong>
        </div>

        <button class="btn" id="btnEntregado">Marcar como Entregado</button>
    </div>

    <script>
        // Función para obtener los parámetros de la URL
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Obtener el id del pedido de la URI
        const pedidoId = getQueryParam('id');

        if (!pedidoId) {
            alert('No se ha proporcionado un ID de pedido válido.');
        }

        // Función para cargar los datos del pedido y del usuario
        function cargarPedido() {
            fetch(`http://localhost:8080/api/pedidos/buscarPedidoId/${pedidoId}`)
                .then(response => response.json())
                .then(pedido => {
                    document.getElementById('pedidoId').innerText = pedido.id;
                    document.getElementById('createdOn').innerText = pedido.createdOn;
                    document.getElementById('estado').innerText = pedido.estado;

                    // Cargar información del usuario
                    cargarUsuario(pedido.idUsuario);

                    let productosLista = document.getElementById('productosLista');
                    productosLista.innerHTML = ''; // Limpiar lista de productos
                    let precioTotal = 0;

                    const productos = [
                        { id: pedido.idProductoUno, cantidad: pedido.cantProductoUno },
                        { id: pedido.idProductoDos, cantidad: pedido.cantProductoDos },
                        { id: pedido.idProductoTres, cantidad: pedido.cantProductoTres },
                        { id: pedido.idProductoCuatro, cantidad: pedido.cantProductoCuatro },
                        { id: pedido.idProductoCinco, cantidad: pedido.cantProductoCinco },
                        { id: pedido.idProductoSeis, cantidad: pedido.cantProductoSeis },
                        { id: pedido.idProductoSiete, cantidad: pedido.cantProductoSiete },
                        { id: pedido.idProductoOcho, cantidad: pedido.cantProductoOcho },
                        { id: pedido.idProductoNueve, cantidad: pedido.cantProductoNueve },
                        { id: pedido.idProductoDiez, cantidad: pedido.cantProductoDiez }
                    ];

                    // Filtrar los productos no nulos
                    productos.filter(p => p.id != null).forEach(p => {
                        fetch(`http://localhost:8080/api/productos/buscarProductoId/${p.id}`)
                            .then(response => response.json())
                            .then(producto => {
                                let subtotal = producto.precio * p.cantidad;
                                precioTotal += subtotal;

                                productosLista.innerHTML += `
                                    <tr>
                                        <td>${producto.id}</td>
                                        <td>${producto.nombreProducto}</td>
                                        <td>${producto.tipoDeProducto}</td>
                                        <td>${producto.marca}</td>
                                        <td>${p.cantidad}</td>
                                        <td>$${producto.precio.toFixed(2)}</td>
                                        <td>$${subtotal.toFixed(2)}</td>
                                    </tr>
                                `;

                                // Actualizar el total en el DOM
                                document.getElementById('precioTotal').innerText = precioTotal.toFixed(2);
                            });
                    });
                });
        }

        // Función para cargar la información del usuario
        function cargarUsuario(idUsuario) {
            fetch(`http://localhost:8080/api/usuarios/buscarUsuarioId/${idUsuario}`)
                .then(response => response.json())
                .then(usuario => {
                    document.getElementById('usuarioId').innerText = usuario.id;
                    document.getElementById('nombreUsuario').innerText = usuario.nombre;
                    document.getElementById('apellidoUsuario').innerText = usuario.apellido;
                    document.getElementById('emailUsuario').innerText = usuario.email;
                    document.getElementById('telefonoUsuario').innerText = usuario.telefono;
                    document.getElementById('usernameUsuario').innerText = usuario.username;
                });
        }

        // Función para actualizar el estado del pedido a "Entregado"
        function marcarComoEntregado() {
            fetch(`http://localhost:8080/api/pedidos/updatePedidoEstado/${pedidoId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'text/plain',
                },
                body: 'entregado'  // Enviar el texto "entregado"
            })
            .then(response => {
                if (response.ok) {
                    alert('El pedido ha sido marcado como entregado.');
                    cargarPedido(); // Volver a cargar la página actualizada
                }
            });
        }

        // Cargar datos del pedido al cargar la página
        window.onload = cargarPedido;

        // Asignar evento al botón "Entregado"
        document.getElementById('btnEntregado').onclick = marcarComoEntregado;
    </script>
</body>
</html>
