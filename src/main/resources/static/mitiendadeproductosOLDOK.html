<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Productos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table, th, td {
            border: 1px solid black;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            margin: 15px;
            border: none;
            color: white;
            background-color: #007BFF;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .add-button {
            margin-bottom: 20px;
        }

        .delete-button {
            background-color: red;
        }

        .delete-button:hover {
            background-color: darkred;
        }

        .edit-button {
            background-color: orange;
        }

        .edit-button:hover {
            background-color: darkorange;
        }

        .view-button {
            background-color: green;
        }

        .view-button:hover {
            background-color: darkgreen;
        }

        .cart-button {
            background-color: #28a745;
        }

        .cart-button:hover {
            background-color: #218838;
        }

        .cart {
            margin-top: 20px;
            border: 1px solid #000;
            padding: 10px;
            width: 100%;
        }

        .cart-item {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Lista de Productos</h1>

    <!-- Tabla de productos -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre Producto</th>
                <th>Stock</th>
                <th>Precio</th>
                <th>Imagen</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="productoTableBody">
            <!-- Aquí se insertarán los productos desde la base de datos -->
        </tbody>
    </table>

    <!-- Carrito de compras -->
    <div class="cart" id="cart">
        <h2>Carrito de Compras</h2>
        <div id="cartItems"></div>
        <button class="cart-button" id="placeOrder">Realizar Pedido</button>
    </div>

    <button onclick="window.location.href='usercontrolpanel.html'">Regresar al Panel</button>

    <script>
        let carrito = [];
        const maxProductos = 10;

        // Obtener el id y session desde localStorage
        const id = localStorage.getItem('id');
        const session = localStorage.getItem('session');

        // Función para cargar los productos desde el servidor
        function cargarProductos() {
            const productoTableBody = document.getElementById("productoTableBody");
            productoTableBody.innerHTML = ''; // Limpia la tabla

            fetch("http://localhost:8080/api/productos/listarProductos")
                .then(response => response.json())
                .then(data => {
                    data.forEach(producto => {
                        const row = document.createElement("tr");

                        row.innerHTML = 
                            `<td>${producto.id}</td>
                            <td>${producto.nombreProducto}</td>
                            <td>${producto.stock}</td>
                            <td>${producto.precio}</td>
                            <td><img src="${producto.imgUrl}" alt="Imagen" style="width:100px;"/></td>
                            <td>
                                <button class="cart-button" onclick="agregarAlCarrito(${producto.id}, '${producto.nombreProducto}', ${producto.precio}, ${producto.stock})">Agregar al Carrito</button>
                                <button class="delete-button" onclick="eliminarDelCarrito(${producto.id})">Eliminar del Carrito</button>
                            </td>`;

                        productoTableBody.appendChild(row);
                    });
                });
        }

        // Llamada inicial al cargar la página
        document.addEventListener("DOMContentLoaded", cargarProductos);

        // Agregar al carrito
        function agregarAlCarrito(id, nombre, precio, stock) {
            if (carrito.length >= maxProductos) {
                alert("No puedes agregar más de 10 productos.");
                return;
            }

            const cantidad = prompt(`Ingresa la cantidad para ${nombre} (Max: ${stock}):`, 1);
            const cantidadInt = parseInt(cantidad);

            if (cantidadInt > stock || cantidadInt <= 0 || isNaN(cantidadInt)) {
                alert("Cantidad no válida");
                return;
            }

            carrito.push({ id, nombre, precio, cantidad: cantidadInt });
            actualizarCarrito();
        }

        // Eliminar del carrito
        function eliminarDelCarrito(id) {
            carrito = carrito.filter(producto => producto.id !== id);
            actualizarCarrito();
        }

        // Actualizar el carrito
        function actualizarCarrito() {
            const cartItems = document.getElementById("cartItems");
            cartItems.innerHTML = '';

            carrito.forEach((producto, index) => {
                cartItems.innerHTML += `<div class="cart-item">${index + 1}. ${producto.nombre} - Cantidad: ${producto.cantidad} - Precio: ${producto.precio} Total: ${producto.cantidad * producto.precio}</div>`;
            });
        }

        // Realizar pedido
        document.getElementById("placeOrder").addEventListener("click", function() {
            const precioTotal = carrito.reduce((acc, item) => acc + item.precio * item.cantidad, 0);

            const productos = carrito.map((producto, index) => ({
                [`idProducto${index + 1}`]: producto.id,
                [`cantProducto${index + 1}`]: producto.cantidad
            }));

            // Completa con null los productos restantes
            for (let i = carrito.length + 1; i <= maxProductos; i++) {
                productos.push({ [`idProducto${i}`]: null, [`cantProducto${i}`]: null });
            }

            const pedido = {
                idUsuario: id, // Usar el ID del usuario
                idProductoUno: productos[0]?.idProducto1 || null,
                cantProductoUno: productos[0]?.cantProducto1 || 0,
                idProductoDos: productos[1]?.idProducto2 || null,
                cantProductoDos: productos[1]?.cantProducto2 || 0,
                idProductoTres: productos[2]?.idProducto3 || null,
                cantProductoTres: productos[2]?.cantProducto3 || 0,
                idProductoCuatro: productos[3]?.idProducto4 || null,
                cantProductoCuatro: productos[3]?.cantProducto4 || 0,
                idProductoCinco: productos[4]?.idProducto5 || null,
                cantProductoCinco: productos[4]?.cantProducto5 || 0,
                idProductoSeis: productos[5]?.idProducto6 || null,
                cantProductoSeis: productos[5]?.cantProducto6 || 0,
                idProductoSiete: productos[6]?.idProducto7 || null,
                cantProductoSiete: productos[6]?.cantProducto7 || 0,
                idProductoOcho: productos[7]?.idProducto8 || null,
                cantProductoOcho: productos[7]?.cantProducto8 || 0,
                idProductoNueve: productos[8]?.idProducto9 || null,
                cantProductoNueve: productos[8]?.cantProducto9 || 0,
                idProductoDiez: productos[9]?.idProducto10 || null,
                cantProductoDiez: productos[9]?.cantProducto10 || 0,
                precioTotal,
                estado: "activo"
            };

            fetch('http://localhost:8080/api/pedidos/crearPedido', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    //'session': session // Enviar la session del usuario
                },
                body: JSON.stringify(pedido)
            }).then(response => {
                if (response.ok) {
                    alert("Pedido realizado con éxito");
                    carrito = [];
                    actualizarCarrito();
                    cargarProductos(); // Recargar la lista de productos después de realizar el pedido
                } else {
                    alert("Error al realizar el pedido");
                }
            });
        });
    </script>

</body>
</html>
