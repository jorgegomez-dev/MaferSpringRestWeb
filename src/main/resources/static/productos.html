        /* Estilos para el formulario de filtros */

        select, input {

            border-radius: 4px;
            margin-right: 10px;

            transition: all 0.3s ease;

        select:focus, input:focus {

            border-color: #3498db;

        /* Responsive */

        .btn-outline-light.btn-sm {

        .btn-outline-light.btn-sm i {

    <!-- Tabla de productos -->
    <table style=" border-radius: 0px;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre Producto</th>
                <th>Tipo de Producto</th>
                <th>Marca</th>
                <th>Descripción</th>
                <th>Stock</th>
                <th>Precio</th>
                <th>Imagen</th>
                <th>Link de Pago</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="productoTableBody">
            <!-- Aquí se insertarán los datos de la base de datos -->
        </tbody>
    </table>

    <script>

        // Desde aca es el mismo codigo para todas las paginas de la app, con las funciones necesarias para
        // solicitar las validaciones correspondientes, el almacenamiento, la carga de id y session, y la informacion
        // servida para la siguiente pagina en localStorage()
        //-----------------------------------------------------------------------------------------------------------

    async function validarSession() {
        // Obtén el id y la sesión de localStorage
        const id = localStorage.getItem('id');
        const session = localStorage.getItem('session');

        if (!id || !session) {
            console.warn('ID o sesión no disponibles');
            window.location.href = '/login.html'; // Redirige al login si no están presentes
            return false; // La sesión no es válida
        }

        try {
            const response = await fetch('http://localhost:8080/api/autenticacion/validarSession', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'id': id,
                    'session': session
                }
            });

            if (response.ok) {
                return true; // La sesión es válida
            } else if (response.status === 401) {
                console.warn('Sesión inválida o expirada');
                // Borra el id y la sesión de localStorage
                localStorage.removeItem('id');
                localStorage.removeItem('session');
                // Redirige al usuario a la página de login
                window.location.href = '/login.html'; // Cambia esto a tu ruta de login
                return false;
            } else {
                console.error('Error al validar la sesión:', response.statusText);
                return false; // Otros errores
            }
        } catch (error) {
            console.error('Error al validar la sesión:', error);
            return false; // Error al validar
        }
    }

    // Ejecuta la validación de sesión al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
        validarSession(); // Verifica la sesión al cargar cualquier página
    });

        // Hasta aca es el mismo codigo para todas las paginas de la app, con las funciones necesarias para
        // solicitar las validaciones correspondientes, el almacenamiento, la carga de id y session, y la informacion
        // servida para la siguiente pagina.
        //-----------------------------------------------------------------------------------------------------------

        // Función que cambia el tipo de filtro
        function handleFilterChange() {
            const filterType = document.getElementById('filterType').value;
            document.getElementById('filterValue').style.display = 'none';
            document.getElementById('filterTipoProducto').style.display = 'none';

            if (filterType === 'id' || filterType === 'nombre' || filterType === 'marca') {
                document.getElementById('filterValue').style.display = 'inline';
            } else if (filterType === 'tipo') {
                document.getElementById('filterTipoProducto').style.display = 'inline';
            }
        }

// Función para filtrar productos según el tipo de filtro seleccionado
function filtrarProductos() {
    const filterType = document.getElementById('filterType').value;
    let url = "";
    let options = {};

    if (filterType === 'todos') {
        url = "http://localhost:8080/api/productos/listarProductos";
    } else if (filterType === 'id') {
        const id = document.getElementById('filterValue').value;
        // La solicitud por ID debería ser un GET, no necesita 'options'
        url = `http://localhost:8080/api/productos/buscarProductoId/${id}`;
    } else if (filterType === 'nombre') {
        const nombre = document.getElementById('filterValue').value;
                // La solicitud por nombre debería ser un GET, no necesita 'options'
        url = `http://localhost:8080/api/productos/listarProductosPorNombre/${nombre}`;
    } else if (filterType === 'marca') {
        const marca = document.getElementById('filterValue').value;
        // La solicitud por marca debería ser un GET, no necesita 'options'
        url = `http://localhost:8080/api/productos/listarProductosPorMarca/${marca}`;
    } else if (filterType === 'tipo') {
        const tipoProducto = document.getElementById('filterTipoProducto').value;
        // La solicitud por tipoProducto debería ser un GET, no necesita 'options'
        url = `http://localhost:8080/api/productos/listarProductosPorTipoProducto/${tipoProducto}`;
    }

    // Llamada a fetch con el filtro seleccionado
    fetch(url, options)
        .then(response => response.json())
        .then(data => {
            const productoTableBody = document.getElementById("productoTableBody");
            productoTableBody.innerHTML = ""; // Limpiar la tabla

            // Manejo especial cuando la búsqueda devuelve un solo producto (caso de ID)
            if (!Array.isArray(data)) {
                data = [data]; // Convertirlo en un array para reutilizar la lógica
            }

            data.forEach(producto => {
                const row = document.createElement("tr");

                row.innerHTML = 
                    `<td>${producto.id}</td>
                    <td>${producto.nombreProducto}</td>
                    <td>${producto.tipoDeProducto}</td>
                    <td>${producto.marca}</td>
                    <td>${producto.descripcion}</td>
                    <td>${producto.stock}</td>
                    <td>${producto.precio}</td>
                    <td><img src="${producto.imgUrl}" alt="Imagen" style="width:100px;"/></td>
                    <td><a href="${producto.linkPago}" target="_blank">Pagar</a></td>
                    <td>
                        <button class="view-button" onclick="verProducto(${producto.id})">Ver</button>
                        <button class="edit-button" onclick="editarProducto(${producto.id})">Modificar</button>
                        <button class="delete-button" onclick="eliminarProducto(${producto.id})">Eliminar</button>
                    </td>`;

                productoTableBody.appendChild(row);
            });
        })
        .catch(error => {
            console.error('Error al realizar la solicitud:', error);
        });
}

        // Cargar productos al inicio
        document.addEventListener("DOMContentLoaded", function() {
            filtrarProductos(); // Cargar todos los productos por defecto
        });

        // Función para eliminar un producto
        function eliminarProducto(id) {
            if (confirm("¿Estás seguro de eliminar este producto?")) {
                fetch(`http://localhost:8080/api/productos/deleteProducto/${id}`, {
                    method: 'DELETE'
                }).then(response => {
                    if (response.ok) {
                        console.log("Producto eliminado correctamente");
                        location.reload(); // Recargar la página para actualizar la tabla
                    } else {
                        console.log("Error al eliminar el producto");
                    }
                });
            }
        }

        // Función para editar un producto
        function editarProducto(id) {
            window.location.href = `/productoeditar.html?id=${id}`; // Redirige a una página de edición
        }

        // Función para ver un producto
        function verProducto(id) {
            window.location.href = `/productover.html?id=${id}`; // Redirige a la página de detalles del producto
        }
    </script>
