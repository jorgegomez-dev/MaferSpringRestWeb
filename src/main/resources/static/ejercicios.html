    <!-- Tabla de ejercicios -->
    <table style="margin-top: 3.4%; border-radius: 0px;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre Ejercicio</th>
                <th>Sexo</th>
                <th>Cant. Series Min</th>
                <th>Cant. Series Max</th>
                <th>Cant. Repeticiones Min</th>
                <th>Cant. Repeticiones Max</th>
                <th>Descanso Min (minutos)</th>
                <th>Descanso Max (minutos)</th>
                <th>Músculo</th>
                <!-- <th>Imagen Ejercicio</th> -->

            </tr>
        </thead>
        <tbody id="exerciseTableBody">
            <!-- Aquí se insertarán los datos de la base de datos -->
        </tbody>

    <script>

async function validarSession() {
        // Obtén el id y la sesión de localStorage
        const id = localStorage.getItem('id');
        const session = localStorage.getItem('session');

        if (!id || !session) {
            console.warn('ID o sesión no disponibles');
            window.location.href = '/login.html'; // Redirige al login si no están presentes
            return false; // La sesión no es válida
        }

        try {
            const response = await fetch('http://localhost:8080/api/autenticacion/validarSession', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'id': id,
                    'session': session
                }
            });

            if (response.ok) {
                return true; // La sesión es válida
            } else if (response.status === 401) {
                console.warn('Sesión inválida o expirada');
                // Borra el id y la sesión de localStorage
                localStorage.removeItem('id');
                localStorage.removeItem('session');
                // Redirige al usuario a la página de login
                window.location.href = '/login.html'; // Cambia esto a tu ruta de login
                return false;
            } else {
                console.error('Error al validar la sesión:', response.statusText);
                return false; // Otros errores
            }
        } catch (error) {
            console.error('Error al validar la sesión:', error);
            return false; // Error al validar
        }
    }

    // Ejecuta la validación de sesión al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
        validarSession(); // Verifica la sesión al cargar cualquier página
    });

        // Cargar ejercicios desde el servidor con fetch
        document.addEventListener("DOMContentLoaded", function() {
            fetch("http://localhost:8080/api/ejercicios/listarEjercicios")
                .then(response => response.json())
                .then(data => {
                    const exerciseTableBody = document.getElementById("exerciseTableBody");

                    data.forEach(ejercicio => {
                        const row = document.createElement("tr");

                        row.innerHTML = `
                            <td>${ejercicio.id}</td>
                            <td>${ejercicio.nombreEjercicio}</td>
                            <td>${ejercicio.sexo}</td>
                            <td>${ejercicio.cantSeriesMin}</td>
                            <td>${ejercicio.cantSeriesMax}</td>
                            <td>${ejercicio.cantRepeticionesMin}</td>
                            <td>${ejercicio.cantRepeticionesMax}</td>
                            <td>${ejercicio.descansoMinutosMin}</td>
                            <td>${ejercicio.descansoMinutosMax}</td>
                            <td>${ejercicio.musculo}</td>
                            <td>
                                <button class="view-button" onclick="verEjercicio(${ejercicio.id})">Ver</button>
                                <button class="edit-button" onclick="editarEjercicio(${ejercicio.id})">Modificar</button>
                                <button class="delete-button" onclick="eliminarEjercicio(${ejercicio.id})">Eliminar</button>
                            </td>
                        `;

                        exerciseTableBody.appendChild(row);
                    });
                });
        });

        // Función para eliminar un ejercicio
function eliminarEjercicio(id) {
    if (confirm("¿Estás seguro de eliminar este ejercicio?")) {
        const userId = localStorage.getItem('id');
        const session = localStorage.getItem('session');
        fetch(`http://localhost:8080/api/ejercicios/deleteEjercicio/${id}`, { // id como parte de la URL
            method: 'DELETE',
            headers: {
                'session': session,
                'userId': userId
            }
        })
        .then(response => {
            if (response.status === 401) {
                // Si el servidor responde con UNAUTHORIZED
                alert('Error de autenticación. La sesión ha expirado. Vuelva a loguearse.');
                window.location.href = 'login.html'; // Redirigir a la página de login
            } else if (response.status === 204) {
                // Si el estado es 204, no hay contenido
                alert('Ejercicio eliminado correctamente.');
            } else if (response.ok) {
                return response.json(); // Si la respuesta es OK, devolver los datos
            } else {
                throw new Error('Error inesperado al eliminar ejercicio.');
            }
        })
        .catch(error => {
            console.error("Error al eliminar el ejercicio:", error);
            console.log("Error de red. Por favor, intenta de nuevo.");
        });
    }
}


        // Función para editar un ejercicio
        function editarEjercicio(id) {
            window.location.href = `/ejercicioeditar.html?id=${id}`; // Redirige a una página de edición
        }

        // Función para ver un ejercicio
        function verEjercicio(id) {
            window.location.href = `/ejerciciover.html?id=${id}`; // Redirige a la página de detalles del ejercicio
        }
    </script>
