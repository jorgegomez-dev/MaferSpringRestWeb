<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar Rutina</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="password"],
        select,
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Asignar Rutina</h1>

    <form id="editUserForm">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" disabled>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" disabled>

        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" disabled>

        <label for="telefono">Telefono:</label>
        <input type="number" id="telefono" name="telefono" step="1" disabled>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" disabled>

        <label for="password">Contraseña (dejar en blanco para no cambiar):</label>
        <input type="password" id="password" name="password" disabled>

        <label for="role">Rol:</label>
        <input type="role" id="role" name="role" disabled>

        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" name="peso" step="0.01" disabled>

        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" name="altura" step="0.01" disabled>

        <label for="sexo">Sexo:</label>
        <select id="sexo" name="sexo" disabled>
            <option value="" disabled selected>Selecciona el sexo</option>
            <option value="Hombre">Hombre</option>
            <option value="Mujer">Mujer</option>
        </select>

        <label for="urlfotoperfil">Foto de Perfil:</label>
        <input type="text" id="urlfotoperfil" name="urlfotoperfil" disabled>

        <label for="idAsesoriaActual">Id Asesoría:</label>
        <input type="number" id="idAsesoriaActual" name="idAsesoriaActual" disabled>

        <label for="fechaInicioAsesoria">Fecha Inicio Asesoría:</label>
        <input type="date" id="fechaInicioAsesoría" name="fechaInicioAsesoria" disabled>

        <label for="rutina">Selecciona una Rutina:</label>
        <select id="rutina" name="rutina" required>
            <option value="" disabled selected>Selecciona una rutina</option>
        </select>

        <label for="fechaInicioRutina">Fecha Inicio Rutina:</label>
        <input type="date" id="fechaInicioRutina" name="fechaInicioRutina" required>

        <button type="submit">Guardar Cambios</button>
        <button class="add-button" onclick="window.location.href='usuarios.html'">Volver</button>
        <button class="add-button" onclick="window.location.href='admincontrolpanel.html'">Regresar al Panel</button>
    </form>

    <script>
        // Obtener el ID del usuario desde localStorage
        const id = localStorage.getItem('id');
        const session = localStorage.getItem('session');
        const userId = localStorage.getItem('targetUserId');
        
        // Verificar que los datos existan
        if (!id || !session || !userId) {
            console.error("ID o Session no están disponibles en localStorage.");
            window.location.href = 'login.html'; // Redirigir al login
        }

        // Función para cargar datos del usuario
        function cargarDatosUsuario(userId) {
            fetch(`http://localhost:8080/api/usuarios/buscarUsuarioId`, {
                method: 'GET',
                headers: {
                    'id': id,
                    'session': session,
                    'userId': userId
                }
            })
            .then(response => {
            if (response.status === 401) {
                // Si el servidor responde con UNAUTHORIZED
                alert('Error de autenticación. La sesión ha expirado. Vuelva a loguearse.');
                window.location.href = 'login.html'; // Redirigir a la página de login
            } else if (response.ok) {
                return response.json(); // Si la respuesta es OK, devolver los datos
            } else {
                throw new Error('Error inesperado al cargar usuarios.');
            }
        })
            .then(user => {
                // Verificar y asignar los valores de los campos
                document.getElementById('nombre').value = user.nombre || '';
                document.getElementById('apellido').value = user.apellido || '';
                document.getElementById('email').value = user.email || '';
                document.getElementById('telefono').value = user.telefono || 0;
                document.getElementById('username').value = user.username || '';
                document.getElementById('password').value = null;
                document.getElementById('role').value = user.role || '';
                document.getElementById('peso').value = user.peso || 0;
                document.getElementById('altura').value = user.altura || 0;
                document.getElementById('sexo').value = user.sexo || '';
                document.getElementById('urlfotoperfil').value = user.urlfotoperfil || '';
                document.getElementById('fechaInicioRutina').value = user.fechaInicioRutina || '';
                document.getElementById('idAsesoriaActual').value = user.idAsesoriaActual || 0;
                document.getElementById('fechaInicioAsesoría').value = user.fechaInicioAsesoría || '';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('No se pudo cargar el usuario.');
            });
        }

        // Función para cargar rutinas
        function cargarRutinas() {
            fetch("http://localhost:8080/api/rutinas/listarRutinas")
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Error al cargar las rutinas');
                    }
                    return response.json();
                })
                .then(rutinas => {
                    const rutinaSelect = document.getElementById('rutina');
                    rutinas.forEach(rutina => {
                        const option = document.createElement('option');
                        option.value = rutina.id; // Guardar el ID de la rutina
                        option.textContent = rutina.nombreRutina; // Mostrar el nombre de la rutina
                        rutinaSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('No se pudieron cargar las rutinas.');
                });
        }

        // Cargar los datos del usuario y las rutinas al iniciar
        cargarDatosUsuario(userId);
        cargarRutinas();

        // Manejar la actualización del usuario
        document.getElementById('editUserForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const userData = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value,
                username: document.getElementById('username').value,
                role: document.getElementById('role').value,
                peso: parseFloat(document.getElementById('peso').value),
                altura: parseFloat(document.getElementById('altura').value),
                sexo: document.getElementById('sexo').value,
                urlfotoperfil: document.getElementById('urlfotoperfil').value,
                fechaInicioRutina: document.getElementById('fechaInicioRutina').value,
                idAsesoriaActual: document.getElementById('idAsesoriaActual').value,
                fechaInicioAsesoría: document.getElementById('fechaInicioAsesoría').value,
                idRutinaActual: parseFloat(document.getElementById('rutina').value) // Agregar el ID de la rutina seleccionada
            };


            fetch(`http://localhost:8080/api/usuarios/updateUsuarioAdmin`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'id': id,
                    'session': session,
                    'userId': userId
                },
                body: JSON.stringify(userData)
            })
            .then(response => {
                if (response.ok) {
                    alert('Usuario actualizado con éxito');
                    window.location.href = 'usuarios.html'; // Redirigir después de actualizar
                } else {
                    throw new Error('Error al actualizar el usuario');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('No se pudo actualizar el usuario.');
            });
        });
    </script>
</body>
</html>
